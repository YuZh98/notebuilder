name: CI

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/ci.yml'

jobs:
  check-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

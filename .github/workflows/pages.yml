name: Site

# Publishes site/ (the NoteBuilder landing page) to GitHub Pages, with the live demo lessons built
# from docs/examples/ and the committed Reader template. One-time setup: Settings → Pages →
# Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/examples/**'
      - 'v2/src/lib/generated/reader-template.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the demo lessons
        run: node site/build-demo.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
